name: Deploy Game Bookshelf to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # one-off: clear a Pages deployment that got stuck "in progress" on 2026-11-05
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages/deployments/5654f48f9fc51ba59e87b95931b91fe3ba5925ee/cancel || true
          sleep 5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # the website lives in the gamebookshelf folder
          path: gamebookshelf
      - id: deployment
        uses: actions/deploy-pages@v5
