<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lumen</title>
<meta name="description" content="Turn the mirrors to bend a beam of light through every crystal. A new puzzle every level.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141022'/%3E%3Cpath d='M4 22 L16 22 L16 8 L28 8' stroke='%23ffcf5a' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#141022;color:#f4ecdc;font-family:Fraunces,Georgia,serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
header{width:min(560px,100%);display:flex;align-items:baseline;justify-content:space-between}h1{font-size:40px;font-weight:800;letter-spacing:-.01em}#lvl{font-size:18px;color:#c9b8e8}
canvas{width:min(560px,92vw,72vh);height:min(560px,92vw,72vh);border-radius:14px;cursor:pointer}
footer{width:min(560px,100%);display:flex;justify-content:space-between;align-items:center;font:500 15px/1.4 system-ui,sans-serif;color:#c9b8e8;min-height:44px}
button{font:800 16px Fraunces,serif;padding:12px 22px;border:0;border-radius:10px;background:#ffcf5a;color:#141022;cursor:pointer}button.ghost{background:transparent;color:#f4ecdc;border:1px solid #4b3f72}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hide{visibility:hidden}
</style>
</head>
<body>
<main>
 <header><h1>Lumen</h1><span id="lvl">Level 1</span></header>
 <canvas id="c" width="1120" height="1120" aria-label="Puzzle board"></canvas>
 <footer><span id="msg">Tap a mirror to turn it. Light every crystal.</span><span><button class="ghost" id="reset">Restart</button> <button id="next" class="hide">Next level</button></span></footer>
</main>
<script src="game.js"></script>

</html>
