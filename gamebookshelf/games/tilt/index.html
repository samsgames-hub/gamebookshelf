<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tilt</title>
<meta name="description" content="Steer a glowing ball down an endless neon slope. Dodge the red blocks, jump the gaps, don't fall off.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0716'/%3E%3Cpath d='M4 26 L28 14' stroke='%2300f0d0' stroke-width='3'/%3E%3Ccircle cx='14' cy='15' r='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#0a0716;color:#e9fffb;font-family:'Chakra Petch',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700}#dist{font-size:40px;line-height:1}#spd{font-size:16px;color:#7ff5e3;text-align:right}
.panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));padding:28px;border-radius:16px;background:rgba(10,7,22,.86);border:1px solid #00f0d0;text-align:center}
.panel.hide{display:none}h1{font-size:56px;letter-spacing:.04em}h2{font-size:28px}.panel p{margin-top:12px;font:500 15px/1.5 system-ui,sans-serif;color:#c8e9e4}.how{color:#00f0d0!important;font-weight:700!important}
.big{font:700 60px 'Chakra Petch',sans-serif!important;color:#fff!important;line-height:1}
button{margin-top:18px;font:700 18px 'Chakra Petch',sans-serif;padding:12px 26px;border:0;border-radius:10px;background:#00f0d0;color:#0a0716;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#touch{position:fixed;inset:0;display:flex}#touch div{flex:1}
</style>
</head>
<body>
<div id="touch"><div id="tl"></div><div id="tr"></div></div>
<div id="hud"><div id="dist">0</div><div id="spd"></div></div>
<div id="start" class="panel"><h1>TILT</h1><p>Roll down an endless slope that keeps getting faster. Red blocks end your run, and so does rolling off the edge.</p><p class="how">A and D or the arrow keys to steer. On a phone, hold the left or right side of the screen.</p><button id="go">Roll</button><p id="bestS"></p></div>
<div id="over" class="panel hide"><h2 id="oT">You fell</h2><p class="big" id="oS">0</p><p id="oB"></p><button id="again">Roll again</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
<!-- visitor counter: no cookies, no personal data -->
<script data-goatcounter="https://gamebookshelf.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
