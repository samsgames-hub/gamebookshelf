<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Bookshelf</title>
<meta name="description" content="Free games you can play right in your browser.">
<!-- Google AdSense -->
<meta name="google-adsense-account" content="ca-pub-5600678294191186">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5600678294191186" crossorigin="anonymous"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312192a'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%232fd67b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--s1:#121923;--s2:#1a2330;--line:#263142;--text:#e8eef6;--muted:#8e9bb0;--go:#2fd67b;--goD:#1fae60;--accent:#4cc9ff;
--ui:'Barlow','Segoe UI',system-ui,sans-serif;--disp:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 var(--ui);min-height:100vh}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;height:64px;padding:0 32px;background:rgba(10,14,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(38,49,66,.6)}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--disp);letter-spacing:.01em}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--go),#18a3ff);display:grid;place-items:center}
.brand i::after{content:"";border-left:9px solid #06110b;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.bar nav{display:flex;gap:4px}
.bar nav a{padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:500}
.bar nav a:hover{color:var(--text);background:var(--s1)}
/* hero */
.hero{position:relative;height:min(72vh,660px);min-height:460px;overflow:hidden;background:#05070b}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.slide.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 40%;transform:scale(1.04);transition:transform 7s linear}
.slide.on img{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,14,20,.94) 0%,rgba(10,14,20,.72) 32%,rgba(10,14,20,0) 62%),linear-gradient(0deg,var(--bg) 0%,rgba(10,14,20,0) 34%)}
.hcopy{position:absolute;z-index:2;left:max(32px,calc((100vw - 1280px)/2 + 32px));bottom:72px;max-width:600px}
.hcopy h1{margin:0;font:700 clamp(52px,7.5vw,96px)/.9 var(--disp);letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;padding:0;list-style:none}
.tags li{padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.1);font-size:14px;font-weight:500;color:#cdd6e3}
.hcopy p{margin:16px 0 26px;font-size:18px;color:#cbd5e2;max-width:46ch}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 30px;border-radius:10px;border:0;cursor:pointer;background:linear-gradient(180deg,#3be488,var(--goD));color:#04140b;font:600 18px var(--ui);box-shadow:0 8px 24px rgba(47,214,123,.25)}
.play:hover{filter:brightness(1.08)}.play:active{transform:translateY(1px)}
.play svg{width:16px;height:16px}
.ghost{display:inline-flex;align-items:center;height:52px;padding:0 22px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);cursor:pointer;font-weight:500;font-size:17px}
.ghost:hover{background:rgba(255,255,255,.12)}
.thumbs{position:absolute;z-index:3;right:max(32px,calc((100vw - 1280px)/2 + 32px));bottom:72px;display:flex;flex-direction:column;gap:10px;width:230px}
.thumb{position:relative;display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1px solid transparent;background:rgba(18,25,35,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;text-align:left;overflow:hidden}
.thumb img{width:72px;height:42px;object-fit:cover;border-radius:6px;flex:none}
.thumb span{font-weight:600;font-size:15px;line-height:1.2}
.thumb:hover{background:rgba(26,35,48,.8)}
.thumb[aria-selected="true"]{background:rgba(26,35,48,.92);border-color:rgba(255,255,255,.14)}
.thumb .prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent)}
.thumb[aria-selected="true"] .prog{animation:prog var(--dur,7s) linear forwards}
.hero.paused .thumb .prog{animation-play-state:paused}
@keyframes prog{to{width:100%}}
/* library */
main{max-width:1280px;margin:0 auto;padding:12px 32px 40px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:30px 0 16px}
.sec h2{margin:0;font:700 30px var(--disp)}.sec span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:22px}
.tile{border-radius:12px;overflow:hidden;background:var(--s1);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:#3a4a62}
.tile .art{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--s2)}
.tile .art img{width:100%;height:100%;object-fit:cover;display:block}
.tile .art .gen{position:absolute;inset:0;display:grid;place-items:center;font:700 34px var(--disp);text-align:center;padding:16px}
.tile .hov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,12,.45);opacity:0;transition:opacity .2s}
.tile .hov b{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--go);color:#04140b;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tile .hov svg{width:20px;height:20px;margin-left:3px}
.tile:hover .hov,.tile .art:focus-visible .hov{opacity:1}
.tile .art:focus-visible{outline-offset:-3px}
.tile .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 16px}
.tile h3{margin:0;font:600 20px var(--ui)}
.tile p{margin:2px 0 0;color:var(--muted);font-size:15px}
.tile .info{flex:none;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.tile .info:hover{color:var(--text);border-color:#3a4a62}
.soon{border-radius:12px;border:1px dashed var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;min-height:200px;color:var(--muted);text-align:center;padding:20px}
.soon strong{color:var(--text);font:600 18px var(--ui)}
/* about */
.about{max-width:1280px;margin:0 auto;padding:10px 32px 70px}
.about .box{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.about h2{margin:0 0 8px;font:700 30px var(--disp)}
.about p{margin:0 0 10px;color:#c4cedb;max-width:60ch}
.about ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.about li{display:flex;gap:12px;align-items:flex-start;color:#c4cedb}
.about li svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--go)}
/* details drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(2,4,8,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--s1);border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;overflow-y:auto;box-shadow:-30px 0 60px rgba(0,0,0,.4)}
body.open{overflow:hidden}body.open .scrim{opacity:1;pointer-events:auto}body.open .drawer{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.drawer .art{aspect-ratio:16/9;background:var(--s2);position:relative}.drawer .art img{width:100%;height:100%;object-fit:cover;display:block}
.drawer .art .gen{position:absolute;inset:0;display:grid;place-items:center;font:700 40px var(--disp)}
.drawer .in{padding:24px 28px 40px}
.drawer h2{margin:0;font:700 46px/.95 var(--disp)}
.drawer .blurb{color:#cbd5e2;font-size:17px;margin:14px 0 22px}
.close{position:absolute;z-index:2;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(10,14,20,.75);cursor:pointer;display:grid;place-items:center;font-size:18px}
.close:hover{background:rgba(30,40,55,.95)}
dl{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;margin:26px 0 0;padding:20px 0 0;border-top:1px solid var(--line)}
dt{color:var(--muted)}dd{margin:0}
dd ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
kbd{display:inline-block;min-width:52px;text-align:center;font:600 13px var(--ui);padding:2px 8px;border-radius:6px;background:var(--s2);border:1px solid var(--line);margin-right:10px}
.note{margin:16px 0 0;color:var(--muted);font-size:15px}
footer{max-width:1280px;margin:0 auto;padding:0 32px 40px;color:var(--muted);font-size:14px}#visits{margin-top:6px;font-variant-numeric:tabular-nums}#visits b{color:var(--text);font-weight:600}
#foot{border-top:1px solid var(--line);padding-top:22px}
.dots{display:none;position:absolute;z-index:3;left:18px;bottom:18px;gap:8px}
.dots button{width:32px;height:20px;padding:8px 0;border:0;border-radius:2px;background-color:rgba(255,255,255,.25);background-clip:content-box;cursor:pointer}
.dots button[aria-selected="true"]{background-color:var(--accent)}
@media (max-width:900px){
 .thumbs{display:none}.bar{padding:0 18px;gap:14px}.bar nav a{padding:8px 10px}
 main,.about{padding-left:18px;padding-right:18px}footer{padding-left:18px;padding-right:18px}
 .hero{height:80vh;min-height:520px}.hcopy{left:18px;right:18px;bottom:54px}
 .slide::after{background:linear-gradient(0deg,var(--bg) 6%,rgba(10,14,20,.78) 50%,rgba(10,14,20,.15) 85%)}
 .slide img{object-position:63% 25%}.hcopy p{font-size:17px}
 .about .box{grid-template-columns:1fr;padding:22px}
 .dots{display:flex}
}
@media (max-width:420px){.brand span{font-size:20px}.acts .play,.acts .ghost{flex:1;justify-content:center}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}.slide img{transform:none!important}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#top" aria-label="Home"><i aria-hidden="true"></i><span id="siteName">Game Bookshelf</span></a>
  <nav aria-label="Main"><a href="#games">Games</a><a href="#about">About</a></nav>
</header>
<span id="top"></span>
<section class="hero" id="hero" aria-roledescription="carousel" aria-label="Featured games"></section>
<main>
  <div class="sec" id="games"><h2>All games</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
</main>
<section class="about" id="about"><div class="box">
  <div><h2>About</h2><p id="aboutText"></p></div>
  <ul>
    <li><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Nothing to download or install. Press Play and the game opens in this tab.</li>
    <li><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Your progress and records are saved in your own browser.</li>
    <li><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Every game is free. No accounts, no ads.</li>
  </ul>
</div></section>
<footer><div id="foot"></div><div id="visits" hidden></div></footer>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Game details"></aside>
<script>
/* ============ EDIT THESE TO CUSTOMIZE YOUR SITE ============ */
const SITE={
  name:'Game Bookshelf',
  about:'A home for the games I make. Each one runs right in your browser, on a computer or a phone, and new ones get added here as they are finished.',
  footer:'Made by me. Free to play, right in your browser.'
};
// To add a game:
//  1. Put the game's folder inside games/ (it needs its own index.html).
//  2. Optional: add two pictures to assets/ — a wide banner (about 1920x820) and a 16:9 tile (about 800x450).
//  3. Copy one of the entries below, paste it at the end of the list and change the details.
const GAMES=[
{id:'dub-ten',title:'Dub Ten',path:'games/dub-ten/index.html',
 hero:'assets/dub-ten-hero.webp',tile:'assets/dub-ten-tile.webp',accent:'#ff5a1f',
 tags:['Freeski','Tricks','3D'],
 pitch:'Ski a terrain park: spin corks off big kickers, slide rails, drop into the superpipe and link it all into one line.',
 blurb:'Six parks: a floodlit slopestyle course at night, a pro line of big kickers at sunrise, a rail line through snowy pines, a deep-powder bowl with cliff drops, one huge Big Air jump and a superpipe. Load a pop at the lip, throw spins, flips, corks and rodeos, hold grabs for bonus points and land clean to bank your line. A speed guide shows if you are fast enough for the jump ahead, and lift tickets you earn unlock new gear in the locker.',
 facts:{Players:'1',Length:'About a minute a run',Saves:'Scores, gear and settings stay in your browser'},
 controls:[['A D','carve, spin in the air'],['W S','tuck and brake, front and back flips'],['Space','hold and let go to pop'],['Shift Q E','mute, tail and japan grabs'],['Arrows','air roll, rodeo'],['B','butter'],['R','hold to restart'],['Esc','pause']],
 note:'Plays with a keyboard, a controller or touch.'},
{id:'skyline',title:'Skyline',path:'games/skyline/index.html',
 hero:'assets/skyline-hero.webp',tile:'assets/skyline-tile.webp',accent:'#ff8a5c',
 tags:['Arcade','One button','Quick'],
 pitch:'Stack sliding blocks into the tallest tower you can. Whatever hangs over the edge falls off, so time every drop.',
 blurb:'Each new block slides across the top of your tower. Tap to drop it. Land it dead on for a perfect, keep a streak of perfects going and the blocks start growing back. The sky turns from sunset to starry night as you climb.',
 facts:{Players:'1',Length:'1 to 3 minutes a tower',Saves:'Your best tower stays in your browser'},
 controls:[['Tap, click or Space','drop the block']],
 note:'Plays on a phone or a computer.'},
{id:'slingshot',title:'Slingshot',path:'games/slingshot/index.html',
 hero:'assets/slingshot-hero.webp',tile:'assets/slingshot-tile.webp',accent:'#6be3ff',
 tags:['Arcade','One button','Space'],
 pitch:'Circle a planet, let go at the right moment and fly to the next one. Miss and you drift off into space.',
 blurb:'You orbit each planet until you let go, then fly off in a straight line. Get pulled in by the next planet to keep climbing. Later planets drift side to side and orbits get faster. Grab stars on the way for bragging rights.',
 facts:{Players:'1',Length:'1 to 3 minutes a run',Saves:'Your best run stays in your browser'},
 controls:[['Tap, click or Space','let go of the orbit']],
 note:'Plays on a phone or a computer.'},
{id:'lumen',title:'Lumen',path:'games/lumen/index.html',
 hero:'assets/lumen-hero.webp',tile:'assets/lumen-tile.webp',accent:'#ffcf5a',
 tags:['Puzzle','Relaxing','Endless levels'],
 pitch:'Turn the mirrors to bend a beam of light through every crystal on the board.',
 blurb:'Each level is a fresh grid of mirrors and crystals with a guaranteed solution. Tap a mirror to flip it and watch the beam reroute. Boards grow bigger and crystals multiply as you go, and some mirrors are only there to fool you.',
 facts:{Players:'1',Length:'A minute or two a level',Saves:'Your level stays in your browser'},
 controls:[['Tap or click','turn a mirror'],['Enter','next level']],
 note:'Plays on a phone or a computer.'},
{id:'tilt',title:'Tilt',path:'games/tilt/index.html',
 hero:'assets/tilt-hero.webp',tile:'assets/tilt-tile.webp',accent:'#00f0d0',
 tags:['Arcade','Endless','3D'],
 pitch:'Steer a glowing ball down an endless neon slope that keeps getting faster. Dodge the red blocks and don’t fall off.',
 blurb:'The track twists, narrows and breaks into gaps as you speed up. Ramps launch you over drops, walled sections let you breathe, and red blocks end the run on contact. Every run is a new track.',
 facts:{Players:'1',Length:'30 seconds to a few minutes',Saves:'Your best distance stays in your browser'},
 controls:[['A D or arrows','steer'],['Space','start again']],
 note:'On a phone, hold the left or right side of the screen to steer.'},
{id:'rough-ride',title:'Rough Ride',path:'games/rough-ride/index.html',
 hero:'assets/rough-ride-hero.webp',tile:'assets/rough-ride-tile.webp',accent:'#ff5d3a',
 tags:['Driving','Physics','25 levels'],
 pitch:'Drive a bouncy truck over hills, ramps, steps and gaps to the checkered flag, and land on your wheels, not your roof.',
 blurb:'Twenty-five levels that get steeper and gappier as you go. Give it gas to fly off ramps, lean the truck in the air to line up your landing, and brake before the big drops. Every level has been beaten, so every level can be.',
 facts:{Players:'1',Length:'15 to 40 seconds a level',Saves:'Unlocked levels and best times stay in your browser'},
 controls:[['D or right arrow','gas, lean forward in the air'],['A or left arrow','brake and reverse, lean back in the air'],['R','restart the level']],
 note:'On a phone, use the Gas and Brake pedals at the bottom of the screen.'},
{id:'switchback',title:'Switchback',path:'games/switchback/index.html',
 hero:'assets/switchback-hero.webp',tile:'assets/switchback-tile.webp',accent:'#ffd21f',
 tags:['Racing','Mountain roads','3D'],
 pitch:'Race five rivals over three laps of a mountain pass, brake late into the hairpins and use your nitro to take the lead.',
 blurb:'Four circuits wind through alpine meadows, a lake at golden hour, a snowy ridge and a pass at night. Drift through the hairpins, tuck into a rival’s slipstream to refill your nitro, chase your own ghost in time trial and win races to unlock two faster cars.',
 facts:{Players:'1',Length:'About 4 minutes a race',Saves:'Records, cars and paint stay in your browser'},
 controls:[['W S','accelerate, brake'],['A D','steer'],['Space','handbrake drift'],['Shift','nitro'],['C','change camera'],['R','back on the road'],['Esc','pause']],
 note:'Plays with a keyboard, a controller or touch.'},
{id:'fresh-tracks',title:'Fresh Tracks',path:'games/fresh-tracks/index.html',
 hero:'assets/fresh-tracks-hero.webp',tile:'assets/fresh-tracks-tile.webp',accent:'#8fd3ff',
 tags:['Snowboarding','Endless','3D'],
 pitch:'Carve down an endless mountain, land big spins and flips, and stay ahead of the avalanche coming down behind you.',
 blurb:'Every run is a new mountain under snowy alpine peaks, with its own weather and light, from blue-sky mornings to snowstorms. Weave through pine forests, hit lines of park jumps and cornice drops, chain grabs, spins and flips into combos, and spend your credits on new boards and outfits.',
 facts:{Players:'1',Length:'2 to 5 minutes a run',Saves:'Gear, credits and records stay in your browser'},
 controls:[['A D','carve, spin in the air'],['W','tuck, front flip'],['S','brake, back flip'],['Space','hold and let go to jump'],['Shift','boost, grab in the air'],['Esc','pause']],
 note:'Plays with a keyboard, a controller or touch.'},
{id:'neon-rift',title:'Neon Rift',path:'games/neon-rift/index.html',
 hero:'assets/neon-rift-hero.jpg',tile:'assets/neon-rift-tile.jpg',accent:'#4cc9ff',
 tags:['First-person shooter','Roguelite','3D'],
 pitch:'Hold the containment hall against waves of rift creatures, build your loadout between fights, and bring down three towering bosses.',
 blurb:'Fight wave after wave inside a sealed facility, pick a new upgrade every level, and take down three huge bosses that punish greedy players. Every run changes the arena, the events and your build.',
 facts:{Players:'1',Length:'10 to 30 minutes a run',Saves:'Upgrades and records stay in your browser'},
 controls:[['WASD','move'],['Mouse','aim and shoot'],['Shift','dash'],['Space','jump'],['R','reload'],['1–5','switch weapons'],['Esc','pause']],
 note:'Best on a computer with a mouse.'},
{id:'gamble-with-friends',title:'Gamble With Friends',path:'games/gamble-with-friends/index.html',
 hero:'assets/gamble-with-friends-hero.jpg',tile:'assets/gamble-with-friends-tile.jpg',accent:'#ecc766',
 tags:['Casino','Online multiplayer','Play chips'],
 pitch:'Team up with friends online, hit the casino’s chip goal before the clock runs out, then spend your winnings on power-ups for the next stage.',
 blurb:'Pick from ten tables, including blackjack, roulette, Plinko and Hold’em. Clear each stage’s chip goal before time runs out and spend your gold in the shop on power-ups like the Totem, which undoes your last loss. Play chips only, no real money.',
 facts:{Players:'Solo, or a room of friends online',Length:'About 10 minutes a stage'},
 controls:[['Mouse','place bets and play']],
 note:'Create a room and send your friends the invite link, or share the 4-letter code. Rooms run on a free public server, so anyone with the code can join.'}
];
/* =========================================================== */
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const playIcon='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5l11 6.5-11 6.5z" fill="currentColor"/></svg>';
const genArt=g=>{const h=[...g.id].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return`<div class="gen" style="background:linear-gradient(135deg,hsl(${h} 55% 28%),hsl(${(h+50)%360} 55% 13%))">${esc(g.title)}</div>`};
addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.id){const g=GAMES.find(x=>x.id===t.dataset.id);if(g)t.outerHTML=genArt(g)}},true);
$('siteName').textContent=SITE.name;document.title=SITE.name;$('foot').textContent=SITE.footer;$('aboutText').textContent=SITE.about;
$('count').textContent=GAMES.length+(GAMES.length===1?' game':' games');

// ---- featured banner ----
const hero=$('hero'),DUR=7000,calm=matchMedia('(prefers-reduced-motion: reduce)').matches,multi=GAMES.length>1;let cur=0,timer=null;
hero.innerHTML=GAMES.map((g,i)=>`<div class="slide${i?'':' on'}" role="group" aria-roledescription="slide" aria-label="${i+1} of ${GAMES.length}: ${esc(g.title)}">${g.hero?`<img src="${esc(g.hero)}" alt="" data-id="${esc(g.id)}">`:genArt(g)}
<div class="hcopy"><h1>${esc(g.title)}</h1><ul class="tags">${g.tags.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p>${esc(g.pitch)}</p>
<div class="acts"><a class="play" href="${esc(g.path)}">${playIcon}Play</a><button class="ghost" type="button" data-more="${i}">Details</button></div></div></div>`).join('')+
(multi?`<div class="thumbs" role="tablist" aria-label="Choose a featured game">${GAMES.map((g,i)=>`<button class="thumb" type="button" role="tab" aria-selected="${i===0}" data-i="${i}" style="--dur:${DUR}ms">${g.tile?`<img src="${esc(g.tile)}" alt="" data-id="${esc(g.id)}">`:''}<span>${esc(g.title)}</span><i class="prog"></i></button>`).join('')}</div>
<div class="dots" role="tablist" aria-label="Choose a featured game">${GAMES.map((g,i)=>`<button type="button" role="tab" aria-selected="${i===0}" aria-label="${esc(g.title)}" data-i="${i}"></button>`).join('')}</div>`:'');
function show(i){cur=(i+GAMES.length)%GAMES.length;
 hero.querySelectorAll('.slide').forEach((s,k)=>s.classList.toggle('on',k===cur));
 hero.querySelectorAll('[role=tab]').forEach(t=>t.setAttribute('aria-selected',String(+t.dataset.i===cur)));
 hero.querySelectorAll('.prog').forEach(p=>{p.style.animation='none';void p.offsetWidth;p.style.animation=''});
 document.documentElement.style.setProperty('--accent',GAMES[cur].accent||'#4cc9ff');restart()}
function restart(){clearInterval(timer);if(!calm&&multi)timer=setInterval(()=>{if(!hero.classList.contains('paused')&&!document.hidden)show(cur+1)},DUR)}
hero.querySelectorAll('[role=tab]').forEach(t=>t.addEventListener('click',()=>show(+t.dataset.i)));
const pause=on=>hero.classList.toggle('paused',on);
hero.addEventListener('mouseenter',()=>pause(true));hero.addEventListener('mouseleave',()=>pause(false));
hero.addEventListener('focusin',()=>pause(true));hero.addEventListener('focusout',()=>pause(false));
let tx=null;hero.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
hero.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});

// ---- all games ----
$('grid').innerHTML=GAMES.map((g,i)=>`<div class="tile"><a class="art" href="${esc(g.path)}" aria-label="Play ${esc(g.title)}">${g.tile?`<img src="${esc(g.tile)}" alt="" loading="lazy" data-id="${esc(g.id)}">`:genArt(g)}<span class="hov" aria-hidden="true"><b>${playIcon}</b></span></a>
<div class="meta"><div><h3>${esc(g.title)}</h3><p>${esc(g.tags.slice(0,2).join(', '))}</p></div><button class="info" type="button" data-more="${i}" aria-label="${esc(g.title)} details">Details</button></div></div>`).join('')+
`<div class="soon"><strong>More games on the way</strong>New games show up here when they’re ready.</div>`;

// ---- details panel ----
const drawer=$('drawer');let lastFocus=null;
function openDetails(i){const g=GAMES[i];lastFocus=document.activeElement;
 drawer.innerHTML=`<button class="close" type="button" id="close" aria-label="Close details">✕</button><div class="art">${g.tile||g.hero?`<img src="${esc(g.tile||g.hero)}" alt="" data-id="${esc(g.id)}">`:genArt(g)}</div>
<div class="in"><h2>${esc(g.title)}</h2><ul class="tags">${g.tags.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="blurb">${esc(g.blurb)}</p>
<a class="play" href="${esc(g.path)}">${playIcon}Play ${esc(g.title)}</a>${g.note?`<p class="note">${esc(g.note)}</p>`:''}
<dl>${Object.entries(g.facts||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}${g.controls?`<dt>Controls</dt><dd><ul>${g.controls.map(([k,v])=>`<li><kbd>${esc(k)}</kbd>${esc(v)}</li>`).join('')}</ul></dd>`:''}</dl></div>`;
 document.body.classList.add('open');pause(true);$('close').onclick=closeDetails;setTimeout(()=>$('close').focus(),30)}
function closeDetails(){document.body.classList.remove('open');pause(false);if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.addEventListener('click',e=>{const m=e.target.closest('[data-more]');if(m)openDetails(+m.dataset.more)});
$('scrim').onclick=closeDetails;
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('open'))return;
 if(e.key==='Escape')closeDetails();
 else if(e.key==='Tab'){const f=[...drawer.querySelectorAll('a,button')];if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
document.querySelectorAll('#hero img, #grid img').forEach(img=>{img.addEventListener('error',()=>{const g=GAMES.find(x=>img.getAttribute('src')===x.hero||img.getAttribute('src')===x.tile);if(g&&img.parentNode)img.outerHTML=genArt(g)})});
show(0);
</script>
<!-- visitor counter: no cookies, no personal data -->
<script data-goatcounter="https://gamebookshelf.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
// public visit total from GoatCounter; stays hidden if it can't load
fetch('https://gamebookshelf.goatcounter.com/counter/TOTAL.json').then(r=>r.ok?r.json():null).then(d=>{if(!d||!d.count)return;const e=document.getElementById('visits');e.innerHTML='<b></b> visits so far';e.firstChild.textContent=d.count;e.hidden=false}).catch(()=>{});
</script>
</body>
</html>
