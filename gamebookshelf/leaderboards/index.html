<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leaderboards · Game Bookshelf</title>
<meta name="description" content="The best players on Game Bookshelf: highest Neon Rift waves, tallest Skyline towers, most Stormfall wins and more.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121923'/%3E%3Crect x='5' y='15' width='6' height='11' rx='1.5' fill='%23cfd8e3'/%3E%3Crect x='13' y='8' width='6' height='18' rx='1.5' fill='%23ffd166'/%3E%3Crect x='21' y='18' width='6' height='8' rx='1.5' fill='%23d79a62'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--s1:#121923;--s2:#1a2330;--line:#263142;--text:#e8eef6;--muted:#8e9bb0;--go:#2fd67b;--b:#d79a62;--s:#cfd8e3;--g:#ffd166;--warn:#ff6b6b;--ui:'Barlow','Segoe UI',system-ui,sans-serif;--disp:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#1d1a33 0,transparent 55%),var(--bg);color:var(--text);font:400 16px/1.5 var(--ui);min-height:100vh}
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;height:64px;padding:0 32px;background:rgba(10,14,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(38,49,66,.6)}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--disp)}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--go),#18a3ff);display:grid;place-items:center}
.brand i::after{content:"";border-left:9px solid #06110b;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.bar nav{display:flex;gap:4px}.bar nav a{padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}.bar nav a:hover,.bar nav a.on{color:var(--text);background:var(--s1)}
main{max-width:1100px;margin:0 auto;padding:36px 24px 60px}
h1{font:700 clamp(36px,6vw,54px)/1 var(--disp);margin:0 0 6px}.lead{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
.tabs button{flex:none;font:600 15px var(--ui);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--s1);color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tabs button:hover{color:var(--text)}.tabs button.on{background:var(--text);color:#0a0e14;border-color:var(--text)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}.head h2{margin:0;font:700 30px var(--disp)}.head span{color:var(--muted)}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:14px}
.pod a{display:grid;justify-items:center;gap:4px;padding:16px 10px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:center;transition:transform .15s,border-color .15s;min-width:0}
.pod a:hover{transform:translateY(-3px)}
.pod .r1{padding-top:24px;border-color:rgba(255,209,102,.55);background:linear-gradient(180deg,rgba(255,209,102,.13),var(--s1))}
.pod .r2{border-color:rgba(207,216,227,.4)}.pod .r3{border-color:rgba(215,154,98,.45)}
.medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--disp);color:#1d1503}
.r1 .medal{background:radial-gradient(circle at 35% 30%,#fff,var(--g) 45%,#8a6510);width:54px;height:54px;font-size:24px}.r2 .medal{background:radial-gradient(circle at 35% 30%,#fff,var(--s) 45%,#59636e)}.r3 .medal{background:radial-gradient(circle at 35% 30%,#fff,var(--b) 45%,#6b4220)}
.pod b{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod em{font:700 26px/1 var(--disp);font-style:normal}.pod small{color:var(--muted);font-size:12px}
.list{border-radius:16px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:48px 1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid rgba(38,49,66,.6)}
.row:first-child{border-top:0}.row:hover{background:var(--s2)}
.row.me{background:rgba(47,214,123,.1);box-shadow:inset 3px 0 0 var(--go)}
.rk{font:700 20px var(--disp);color:var(--muted);text-align:center}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.nm small{color:var(--muted);font-weight:500;margin-left:6px}
.sc{font:700 22px var(--disp)}.sc small{font:500 13px var(--ui);color:var(--muted);margin-left:4px}
.rm{border:1px solid rgba(255,107,107,.4);background:none;color:var(--warn);border-radius:8px;padding:4px 8px;font:600 12px var(--ui);cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted)}
.side{display:grid;gap:12px}
.card{padding:16px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.card h3{margin:0 0 6px;font:700 20px var(--disp)}.card p{margin:0;color:var(--muted);font-size:14px}
.you{font:700 40px/1 var(--disp);margin:6px 0}
.btn{display:inline-block;margin-top:10px;font:700 15px var(--ui);padding:10px 14px;border-radius:10px;background:var(--go);color:#06110b}
.btn.alt{background:var(--s2);color:var(--text);border:1px solid var(--line)}
.sk{height:50px;border-top:1px solid rgba(38,49,66,.6);background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.side{order:1}.bar{padding:0 14px;gap:10px}.bar nav a{padding:8px 8px}main{padding:24px 14px 50px}.bar .brand span{display:none}}
@media (max-width:480px){.pod em{font-size:20px}.pod b{font-size:14px}.row{grid-template-columns:36px 1fr auto auto;padding:10px}}
@media (max-width:760px){.bar nav{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.bar nav::-webkit-scrollbar{display:none}}
</style>
</head>
<body>
<header class="bar">
 <a class="brand" href="/" aria-label="Home"><i aria-hidden="true"></i><span>Game Bookshelf</span></a>
 <nav aria-label="Main"><a href="/#games">Games</a><a href="/leaderboards/" class="on">Leaderboards</a><a href="/trophies/">Trophies</a><a href="/account/" data-acct-nav>Sign in</a></nav>
</header>
<main>
 <h1>Leaderboards</h1>
 <p class="lead">The best players on Game Bookshelf. Sign in and your best scores go up automatically.</p>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div class="wrap">
  <section>
   <div class="head"><h2 id="bTitle"></h2><span id="bWhat"></span></div>
   <div class="pod" id="pod"></div>
   <div class="list" id="list" aria-live="polite"></div>
  </section>
  <aside class="side"><div class="card" id="mine"></div><div class="card"><h3>Fair play</h3><p>Scores come from your own game saves when you're signed in. Impossible scores are removed.</p></div></aside>
 </div>
</main>
<script src="/shared/account.js?v=1795104351"></script>
<script src="/shared/trophies.js?v=1795104351"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),A=GBAccount,B=A.BOARDS,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>Number(v).toLocaleString();const ago=t=>{if(!t)return'';const s=(Date.now()-t)/1000;return s<3600?Math.max(1,Math.round(s/60))+'m ago':s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'};
const prof=n=>'/u/'+encodeURIComponent(n);
let cur=(new URLSearchParams(location.search).get('game'))||'neonrift';if(!B.find(b=>b.id===cur))cur='neonrift';
const cache={};
$('tabs').innerHTML=B.map(b=>'<button role="tab" data-id="'+b.id+'">'+esc(b.n)+'</button>').join('');
$('tabs').addEventListener('click',e=>{const t=e.target.closest('[data-id]');if(t)show(t.dataset.id)});
async function show(id,fresh){cur=id;history.replaceState(null,'','?game='+id);const b=B.find(x=>x.id===id);
 document.querySelectorAll('#tabs button').forEach(x=>{const on=x.dataset.id===id;x.classList.toggle('on',on);x.setAttribute('aria-selected',on);if(on)x.scrollIntoView({block:'nearest',inline:'nearest'})});
 $('bTitle').textContent=b.n;$('bWhat').textContent=b.what;
 if(!cache[id]||fresh){$('pod').innerHTML='';$('list').innerHTML='<div class="sk"></div>'.repeat(6);
  try{cache[id]=await A.board(id,100)}catch(err){$('list').innerHTML='<div class="empty">Couldn’t load the leaderboard. '+esc(err.message)+'</div>';return}}
 if(cur!==id)return;render(b,cache[id])}
function render(b,rows){const me=A.uid(),adm=A.isAdmin(),unit=b.unit;
 const top=rows.slice(0,3),order=[top[1],top[0],top[2]],cls=['r2','r1','r3'],rk=[2,1,3];
 $('pod').innerHTML=rows.length?order.map((r,i)=>r?'<a class="'+cls[i]+'" href="'+prof(r.n)+'"><span class="medal">'+rk[i]+'</span><b>'+esc(r.n)+'</b><em>'+fmt(r.s)+'</em><small>'+esc(unit)+'</small></a>':'<span></span>').join(''):'';
 /* admins see every row (podium included) with a remove button */
 const row=(r,n)=>'<div class="row'+(r.u===me?' me':'')+'"><span class="rk">'+n+'</span><a class="nm" href="'+prof(r.n)+'">'+esc(r.n)+(r.u===me?'<small>you</small>':'')+'</a><span class="sc">'+fmt(r.s)+'<small>'+esc(unit)+'</small></span>'+(adm?'<button class="rm" data-u="'+r.u+'">Remove</button>':'<span></span>')+'</div>';
 const shown=adm?rows:rows.slice(3),start=adm?1:4;
 $('list').innerHTML=!rows.length?'<div class="empty">No scores yet. Be the first: sign in and play '+esc(b.n)+'.</div>'
  :shown.length?shown.map((r,i)=>row(r,i+start)).join(''):'<div class="empty">Only '+rows.length+' player'+(rows.length>1?'s':'')+' so far. Your name could be next.</div>';
 const i=A.info(),pos=rows.findIndex(r=>r.u===me);
 $('mine').innerHTML=i.signedIn?(pos>=0?'<h3>Your rank</h3><div class="you">#'+(pos+1)+'</div><p>'+fmt(rows[pos].s)+' '+esc(unit)+' · out of '+rows.length+(rows.length>=100?'+':'')+'</p>':'<h3>Not ranked yet</h3><p>Play '+esc(b.n)+' while signed in and your best score shows up here.</p>')+'<a class="btn alt" href="'+prof(i.name)+'">Your profile</a>':'<h3>Get on the board</h3><p>Sign in and your best scores in every game go up automatically.</p><a class="btn" href="/account/?new">Create an account</a>'}
$('list').addEventListener('click',async e=>{const r=e.target.closest('.rm');if(!r)return;r.disabled=true;r.textContent='Removing…';try{await A.removeEntry(cur,r.dataset.u);show(cur,true)}catch(err){r.textContent=err.message}});
A.onChange(()=>{if(cache[cur])render(B.find(x=>x.id===cur),cache[cur])});
show(cur);
setTimeout(()=>{A.publish&&A.publish();setTimeout(()=>show(cur,true),1500)},1500);
})();
</script>
<script data-goatcounter="https://gamebookshelf.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
