<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Player · Game Bookshelf</title>
<meta name="description" content="A player's profile on Game Bookshelf: level, trophies and best scores.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121923'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%2318a3ff'/%3E%3Cpath d='M7 26a9 9 0 0 1 18 0' fill='%2318a3ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--s1:#121923;--s2:#1a2330;--line:#263142;--text:#e8eef6;--muted:#8e9bb0;--go:#2fd67b;--b:#d79a62;--s:#cfd8e3;--g:#ffd166;--warn:#ff6b6b;--ui:'Barlow','Segoe UI',system-ui,sans-serif;--disp:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at 20% -10%,#10233a 0,transparent 55%),var(--bg);color:var(--text);font:400 16px/1.5 var(--ui);min-height:100vh}
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;height:64px;padding:0 32px;background:rgba(10,14,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(38,49,66,.6)}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--disp)}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--go),#18a3ff);display:grid;place-items:center}
.brand i::after{content:"";border-left:9px solid #06110b;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.bar nav{display:flex;gap:4px}.bar nav a{padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}.bar nav a:hover{color:var(--text);background:var(--s1)}
main{max-width:1000px;margin:0 auto;padding:36px 24px 60px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:24px;border-radius:22px;background:linear-gradient(135deg,rgba(24,163,255,.10),transparent 60%),var(--s1);border:1px solid var(--line)}
.av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font:700 46px var(--disp);color:#06110b;background:linear-gradient(135deg,var(--go),#18a3ff);box-shadow:0 10px 30px rgba(24,163,255,.25)}
.who h1{margin:0;font:700 clamp(34px,6vw,52px)/1 var(--disp);word-break:break-word}
.who .title{color:var(--g);font:600 20px var(--disp);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.who p{margin:6px 0 0;color:var(--muted)}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--g);color:#1d1503;font:700 11px var(--ui);letter-spacing:.08em;vertical-align:8px}
.live{display:inline-flex;align-items:center;gap:6px}.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.live.on i{background:var(--go);box-shadow:0 0 0 3px rgba(47,214,123,.2)}
.lvl{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--g) var(--p,0%),var(--s2) 0);position:relative}
.lvl::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--s1)}
.lvl div{position:relative}.lvl small{display:block;font:600 11px var(--ui);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.lvl b{font:700 40px/1 var(--disp)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{font:700 15px var(--ui);padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--text);cursor:pointer;transition:transform .1s,background .15s}
.btn:hover{background:#223044}.btn:active{transform:scale(.97)}.btn.pri{background:var(--go);border-color:var(--go);color:#06110b}.btn:disabled{opacity:.6}
h2{font:700 26px var(--disp);margin:28px 0 10px}
.show{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tr{display:grid;justify-items:center;gap:4px;padding:18px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:center}
.tr .m{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px}
.tr.b .m{background:radial-gradient(circle at 35% 30%,#fff7,var(--b) 45%,#0006)}.tr.s .m{background:radial-gradient(circle at 35% 30%,#fff9,var(--s) 45%,#0006)}.tr.g .m{background:radial-gradient(circle at 35% 30%,#fffa,var(--g) 45%,#0006)}
.tr.g{border-color:rgba(255,209,102,.45)}.tr b{font-size:16px}.tr small{color:var(--muted);font-size:13px}
.bests{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.best{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--line);transition:border-color .15s}
.best:hover{border-color:#3a4b63}.best span{color:var(--muted);font-size:14px}.best b{display:block;color:var(--text);font-size:16px}.best em{font:700 26px/1 var(--disp);font-style:normal;text-align:right}.best em small{display:block;font:500 12px var(--ui);color:var(--muted)}
.empty{padding:22px;border-radius:14px;background:var(--s1);border:1px dashed var(--line);color:var(--muted);text-align:center}
.msg{min-height:20px;color:var(--muted);font-size:14px;margin-top:6px}
.big{text-align:center;padding:80px 20px}.big h1{font:700 44px var(--disp);margin:0 0 8px}.big p{color:var(--muted)}
.sk{height:180px;border-radius:22px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
@media (max-width:760px){.hero{grid-template-columns:auto 1fr}.lvl{grid-column:1/-1;justify-self:start;width:84px;height:84px}.av{width:72px;height:72px;font-size:34px}.show{grid-template-columns:1fr}.bar{padding:0 14px;gap:10px}.bar nav a{padding:8px 8px}.bar .brand span{display:none}main{padding:24px 14px 50px}}
@media (max-width:760px){.bar nav{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.bar nav::-webkit-scrollbar{display:none}}
</style>
</head>
<body>
<header class="bar">
 <a class="brand" href="/" aria-label="Home"><i aria-hidden="true"></i><span>Game Bookshelf</span></a>
 <nav aria-label="Main"><a href="/#games">Games</a><a href="/leaderboards/">Leaderboards</a><a href="/trophies/">Trophies</a><a href="/account/" data-acct-nav>Sign in</a></nav>
</header>
<main id="main"><div class="sk"></div></main>
<script src="/shared/account.js?v=1795104351"></script>
<script src="/shared/trophies.js?v=1795104351"></script>
<script>
(async()=>{'use strict';
const A=GBAccount,T=GBTrophies,$m=document.getElementById('main'),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMO={'Game Bookshelf':'📚',Skyline:'🏙️',Slingshot:'🚀',Mitosis:'🦠','Neon Rift':'🔫',Firebase:'🛡️',Ridgeline:'🚙','Corner Pocket':'🎱','Gamble With Friends':'🎰',Ironoath:'⚔️','The Quiet Below':'🔦',Stormfall:'⛈️'};
const PAGE={neonrift:'neon-rift',skyline:'skyline',slingshot:'slingshot',mitosis:'mitosis',stormfall:'stormfall',ironoath:'ironoath',ridgeline:'ridgeline',firebase:'firebase',cornerpocket:'corner-pocket',quietbelow:'the-quiet-below'};
const ago=t=>{if(!t)return'a while ago';const s=(Date.now()-t)/1000;return s<90?'just now':s<3600?Math.round(s/60)+' minutes ago':s<86400?Math.round(s/3600)+' hours ago':Math.round(s/86400)+' days ago'};
/* name from /u/Name (via the 404 redirect) or ?n=Name */
const q=new URLSearchParams(location.search);let name=q.get('n')||decodeURIComponent((location.pathname.match(/^\/u\/([^/]+)/)||[])[1]||'');
if(!name){const i=A.info();if(i.signedIn)name=i.name}
if(!name){$m.innerHTML='<div class="big"><h1>Find a player</h1><p>Open a name from the <a href="/leaderboards/" style="text-decoration:underline">leaderboards</a>, or sign in to see your own profile.</p></div>';return}
let p;try{p=await A.profileOf(name)}catch(e){$m.innerHTML='<div class="big"><h1>Couldn’t load this profile</h1><p>'+esc(e.message)+'</p></div>';return}
if(!p){document.title='Player not found · Game Bookshelf';$m.innerHTML='<div class="big"><h1>No player called “'+esc(name)+'”</h1><p>Check the spelling, or find people on the <a href="/leaderboards/" style="text-decoration:underline">leaderboards</a>.</p></div>';return}
const nm=p.n||name;document.title=nm+' · Game Bookshelf';history.replaceState(null,'','/u/'+encodeURIComponent(nm));
const me=A.uid()===p.uid,online=p.at&&Date.now()-p.at<5*60000;
const lv=p.lv||1,L=T.level(p.pts||0),list=T.list.map(t=>({id:t[0],game:t[1],name:t[2],tier:t[4],from:t[6]||t[1]}));
const show=(p.show||[]).map(id=>list.find(t=>t.id===id)).filter(Boolean);
const bests=A.BOARDS.filter(b=>p.best&&p.best[b.id]);
$m.innerHTML='<section class="hero"><div class="av">'+esc(nm[0].toUpperCase())+'</div><div class="who"><h1>'+esc(nm)+(p.adm?'<span class="badge">ADMIN</span>':'')+'</h1><div class="title">'+esc(p.title||'Newcomer')+'</div>'
 +'<p><span class="live'+(online?' on':'')+'"><i></i>'+(p.empty?'Hasn’t played yet':online?(p.game?'Playing '+esc(p.game)+' now':'Online now'):'Last seen '+ago(p.at)+(p.game?' playing '+esc(p.game):''))+'</span> · '+(p.tro||0)+' trophies · '+(p.pts||0)+' points</p>'
 +'<div class="acts" id="acts"></div><div class="msg" id="msg" role="status"></div></div>'
 +'<div class="lvl" style="--p:'+Math.round(L.into/L.need*100)+'%"><div><small>Level</small><b>'+lv+'</b></div></div></section>'
 +'<h2>Showcase</h2>'+(show.length?'<div class="show">'+show.map(t=>'<div class="tr '+t.tier+'"><span class="m">'+(EMO[t.from]||'🏆')+'</span><b>'+esc(t.name)+'</b><small>'+esc(T.TIER[t.tier].n)+' · '+esc(t.from)+'</small></div>').join('')+'</div>':'<div class="empty">'+(me?'Pin up to 3 trophies with ☆ in the <a href="/trophies/" style="text-decoration:underline">Trophy Room</a> to show them here.':'No trophies pinned yet.')+'</div>')
 +'<h2>Best scores</h2>'+(bests.length?'<div class="bests">'+bests.map(b=>'<a class="best" href="/leaderboards/?game='+b.id+'"><span>'+(EMO[b.n]||'')+' <b>'+esc(b.n)+'</b>'+esc(b.what)+'</span><em>'+Number(p.best[b.id]).toLocaleString()+'<small>'+esc(b.unit)+'</small></em></a>').join('')+'</div>':'<div class="empty">No scores yet.</div>');
const acts=document.getElementById('acts'),msg=document.getElementById('msg');
async function friendBtn(){const i=A.info();
 if(me){acts.innerHTML='<a class="btn" href="/trophies/">Edit showcase</a><a class="btn" href="/account/">Friends</a><button class="btn" id="cp">Copy profile link</button>'}
 else if(!i.signedIn){acts.innerHTML='<a class="btn pri" href="/account/?new">Sign in to add friend</a>'}
 else{const f=await A.isFriend(p.uid);acts.innerHTML=f?'<button class="btn" id="fr" data-f="1">✓ Friends</button>':'<button class="btn pri" id="fr">+ Add friend</button>'}
 const cp=document.getElementById('cp');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);msg.textContent='Link copied.'}catch(e){msg.textContent=location.href}};
 const fr=document.getElementById('fr');if(fr)fr.onclick=async()=>{fr.disabled=true;try{if(fr.dataset.f){await A.removeFriend(p.uid);msg.textContent='Removed from your friends.'}else{await A.addFriend(nm);msg.textContent=nm+' is now on your friends list.'}}catch(e){msg.textContent=e.message}friendBtn()}}
friendBtn();A.onChange(friendBtn);
})();
</script>
<script data-goatcounter="https://gamebookshelf.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
